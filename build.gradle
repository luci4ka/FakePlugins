plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.3.2'
}

group = 'ru.terracraft'
version = '1.0.1'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'com.tchristofferson:ConfigUpdater:2.2'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    filteringCharset 'UTF-8'
    // version хардкод в paper-plugin.yml — expand не нужен
}

shadowJar {
    archiveBaseName = 'FakePlugins'
    archiveClassifier = ''
    archiveVersion = project.version

    relocate 'org.bstats', 'ru.terracraft.fake.libs.bstats'
    relocate 'com.tchristofferson.configupdater', 'ru.terracraft.fake.libs.configupdater'

    exclude 'META-INF/maven/**'
    exclude 'META-INF/LICENSE*'
    exclude 'META-INF/NOTICE*'
    exclude 'module-info.class'
    mergeServiceFiles()
}

tasks.named('build') { dependsOn tasks.named('shadowJar') }
tasks.named('jar')   { enabled = false }