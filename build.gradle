plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.0.0'
}

group = 'net.ru.terracraft'
version = '1.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    maven { url = 'https://jitpack.io' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
    implementation 'org.bstats:bstats-bukkit:3.2.1'
    implementation 'com.tchristofferson:ConfigUpdater:2.2'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    filteringCharset 'UTF-8'
    // expand НЕ используем — version хардкод в paper-plugin.yml
}

shadowJar {
    archiveBaseName = 'FakePlugins'
    archiveClassifier = ''
    archiveVersion = project.version
    relocate 'org.bstats', 'net.ru.terracraft.libs.bstats'
    relocate 'com.tchristofferson.configupdater', 'net.ru.terracraft.libs.configupdater'
}

tasks.named('build') { dependsOn tasks.named('shadowJar') }
tasks.named('jar')   { enabled = false }