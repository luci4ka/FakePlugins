plugin-line: "<gray> • </gray><hover:show_text:'<gray>Плагин: </gray><white>%name%</white>'><click:suggest_command:'/fakepl hide %name%'>%name-colored%</click></hover>"

reload-done: "<gradient:#00FFAA:#00AAFF>Конфигурация перезагружена.</gradient>"

hidden-added: "<green>Плагин <white>%name%</white> скрыт из списка.</green>"
hidden-removed: "<green>Плагин <white>%name%</white> снова виден.</green>"
hidden-not-found: "<red>Плагин <white>%name%</white> не найден среди реальных.</red>"
hidden-already: "<red>Плагин <white>%name%</white> уже скрыт.</red>"
hidden-list-empty: "<gray>Список скрытых плагинов пуст.</gray>"

added: "<green>Фейковый плагин <white>%name%</white> добавлен.</green>"
already-exists: "<red>Такой плагин уже есть в списке.</red>"
deleted: "<green>Фейковый плагин <white>%name%</white> удалён.</green>"
not-found: "<red>Плагин не найден.</red>"
renamed: "<green>Переименовано: <white>%old%</white> → <white>%new%</white></green>"
