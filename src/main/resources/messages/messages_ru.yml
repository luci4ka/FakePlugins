prefix: "<gray>[<gold>FakePlugins</gold>]</gray> "

help:
  header: "<gold>=== FakePlugins ===</gold>"
  list: "<yellow>/fakepl list</yellow> <gray>— смешанный список</gray>"
  reallist: "<yellow>/fakepl reallist</yellow> <gray>— только реальные</gray>"
  fakelist: "<yellow>/fakepl fakelist</yellow> <gray>— только фейковые</gray>"
  add: "<yellow>/fakepl add <имя></yellow>"
  delete: "<yellow>/fakepl delete <имя></yellow>"
  rename: "<yellow>/fakepl rename <старое> <новое></yellow>"
